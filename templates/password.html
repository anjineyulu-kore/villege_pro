{% extends "base.html" %}{% block body %}
<form method="post" class="card narrow"><h2>{{ t('change_password') }}</h2><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Current password<input name="old" type="password" autocomplete="current-password" required></label>
<label>New password<input name="new" type="password" minlength="12" autocomplete="new-password" required></label><button class="btn primary">OK</button></form>
{% endblock %}
