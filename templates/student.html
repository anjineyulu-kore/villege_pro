{% extends "base.html" %}{% block body %}
<form method="post" class="card narrow"><h2>🎓 {{ t('student_title') }}</h2><input type="hidden" name="csrf" value="{{ csrf }}">
<label>{{ t('student_name') }}<input name="student" required></label><label>{{ t('class') }}<input name="cls" required></label>
<label>{{ t('school') }}<input name="school"></label><label>{{ t('phone') }}<input name="phone" inputmode="numeric"></label>
<label>{{ t('program') }}<select name="program">{% for p in PROGRAMS %}<option value="{{ p }}">{{ t('prog_' ~ p) }}</option>{% endfor %}</select></label>
<label>{{ t('note') }}<textarea name="note" rows="3"></textarea></label><button class="btn primary block">{{ t('submit') }}</button></form>
{% endblock %}
