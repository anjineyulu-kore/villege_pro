<form method="post" action="{{ url_for('post_update') }}" enctype="multipart/form-data" class="card composer">
<input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="back" value="{{ back }}">
<strong>Post an update</strong>
<textarea name="text" rows="3" maxlength="800" placeholder="Write the news in Telugu or English…" required></textarea>
<div class="row2"><label>Category<select name="category">{% for c in CATS %}<option value="{{ c }}">{{ t('cat_' ~ c) }}</option>{% endfor %}</select></label>
<label>Photo (optional)<input type="file" name="photo" accept="image/*"></label></div>
<label class="chk"><input type="checkbox" name="pinned"> Pin to top</label>
<button class="btn primary">Post update</button></form>
